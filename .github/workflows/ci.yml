name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.93.1", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy,rustfmt
      - name: Format gate on pinned toolchain
        if: matrix.toolchain == '1.93.1'
        run: cargo +1.93.1 fmt --all -- --check
      - name: Clippy
        run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets -- -D warnings
      - name: Unit and TCP integration tests
        run: cargo +${{ matrix.toolchain }} test --locked --all-targets
      - name: Release build
        run: cargo +${{ matrix.toolchain }} build --locked --release
      - name: Repository contracts
        run: python3 scripts/check_repository.py
      - name: Binary smoke including SIGTERM
        run: python3 examples/e2e/drive.py --binary target/release/minotaur
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install cargo-audit --locked
      - run: cargo +stable audit --deny warnings
