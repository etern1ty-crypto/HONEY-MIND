[package]
name = "minotaur"
version = "0.2.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
description = "Privacy-first, bounded TCP deception sensor for internal networks."
repository = "https://github.com/etern1ty-crypto/HONEY-MIND"
readme = "README.md"
keywords = ["honeypot", "security", "blueteam", "tcp", "prometheus"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "minotaur"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "signal", "sync", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Only text exposition is used. Do not pull in protobuf 2.x (RUSTSEC-2024-0437).
prometheus = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
