# Authorised internal-network decoy host only. Apply network isolation first.
# Give each installation a unique sensor.id and a useful site tag.
[sensor]
id = "branch-01-sensor-01"
environment = "production"
[sensor.tags]
site = "branch-01"

[privacy]
mode = "metadata"
capture_http_path = true

[logging]
output = "/var/lib/minotaur/honeypot.jsonl"
stdout = false
buffer_size = 256
max_file_bytes = 10485760
max_files = 3
write_timeout_seconds = 3

[metrics]
enabled = true
bind = "127.0.0.1:9090"
allow_remote = false
max_connections = 16
request_timeout_seconds = 3

[server]
max_concurrent_sessions = 256
session_timeout_seconds = 15
max_session_duration_seconds = 60
shutdown_grace_seconds = 10
rate_limit_per_ip_per_min = 30
max_tracked_ips = 4096
max_bytes_per_session = 1024
max_read_bytes_per_session = 65536
ignore_source_ips = []

[[endpoint]]
name = "admin-ssh"
bind = "0.0.0.0:2222"
protocol = "ssh"

[[endpoint]]
name = "admin-http"
bind = "0.0.0.0:8080"
protocol = "http"
server_header = "nginx"
http_status = 404

[[endpoint]]
name = "legacy-telnet"
bind = "0.0.0.0:2323"
protocol = "telnet"
banner = "Network appliance"

[[endpoint]]
name = "cache-decoy"
bind = "0.0.0.0:6379"
protocol = "raw"
banner = "-NOAUTH Authentication required.\r\n"
