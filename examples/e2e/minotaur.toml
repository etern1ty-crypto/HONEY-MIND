# Local-only smoke configuration. No remote targets or real credentials.
[sensor]
id = "e2e-sensor"
environment = "test"

[privacy]
mode = "metadata"
capture_http_path = true

[logging]
output = "honeypot.jsonl"
buffer_size = 256

[metrics]
enabled = true
bind = "127.0.0.1:9090"

[server]
rate_limit_per_ip_per_min = 0
session_timeout_seconds = 3
max_session_duration_seconds = 10

[[endpoint]]
name = "smoke-ssh"
bind = "127.0.0.1:2222"
protocol = "ssh"

[[endpoint]]
name = "smoke-http"
bind = "127.0.0.1:8080"
protocol = "http"

[[endpoint]]
name = "smoke-telnet"
bind = "127.0.0.1:2323"
protocol = "telnet"
banner = "Smoke test"

[[endpoint]]
name = "smoke-raw"
bind = "127.0.0.1:6379"
protocol = "raw"
banner = "+OK\r\n"
